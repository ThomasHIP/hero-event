<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HERO Event Organizer</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17233b;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}.top{background:#112a55;color:#fff;padding:20px}.top img{width:170px;background:#fff;border-radius:10px}.wrap{max-width:920px;margin:auto;padding:20px 14px 50px}.login,.item{background:#fff;border:1px solid #dce4ef;border-radius:20px;padding:20px;margin-bottom:14px}.login input,.note{width:100%;padding:14px;border:1px solid #bdc8d8;border-radius:12px;font-size:16px}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:850;font-size:16px;cursor:pointer}.blue{background:#2f69e8;color:#fff}.green{background:#16844b;color:#fff}.red{background:#c7364f;color:#fff}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#69768b}.slip{display:block;margin-top:12px;color:#1e5dc7;font-weight:800}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff1c6;color:#725400;font-weight:800}@media(max-width:560px){.meta{grid-template-columns:1fr}}</style></head>
<body><header class="top"><img src="/the-rice/hero-event-logo.jpg" alt="HERO Event"><h1>ผู้จัดงาน / Organizer Admin</h1></header><main class="wrap"><section id="login" class="login"><h2>เข้าสู่ระบบผู้จัดงาน</h2><p class="muted">Enter the organizer passcode.</p><input id="pass" type="password" autocomplete="current-password" placeholder="Organizer passcode"><div class="row"><button class="btn blue" onclick="load()">เปิดรายการ / Open Payments</button></div><p id="msg"></p></section><section id="list"></section></main>
<script>
const API="https://ajbuenoxbsfmwhydvlxd.supabase.co/functions/v1/hero-event-api",KEY="sb_publishable_oron-nE6v6FSF_YPckMCGA_4QHstvwm";let code="";
const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
async function api(action,data={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({action,passcode:code,...data})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function load(){code=pass.value.trim();if(!code)return;msg.textContent="กำลังโหลด… / Loading…";try{const d=await api("admin_list");msg.textContent="";render(d.payments||[])}catch(e){msg.textContent=e.message}}
function render(rows){list.innerHTML=rows.length?rows.map(x=>{const r=Array.isArray(x.reservations)?x.reservations[0]:x.reservations,g=Array.isArray(r.registrations)?r.registrations[0]:r.registrations,b=Array.isArray(r.booths)?r.booths[0]:r.booths;return `<article class="item"><span class="badge">${esc(x.status)}</span><h2>${esc(b.code)} — ${esc(g.business_name)}</h2><div class="meta"><div><b>Reference</b><br>${esc(r.booking_reference)}</div><div><b>Contact</b><br>${esc(g.full_name)}<br>${esc(g.email)}<br>${esc(g.mobile)}</div></div>${x.slip_url?`<a class="slip" href="${esc(x.slip_url)}" target="_blank">เปิดหลักฐานการชำระเงิน / View Payment Slip</a>`:""}${x.status==="submitted"?`<textarea class="note" id="n-${x.id}" placeholder="หมายเหตุ / Review note"></textarea><div class="row"><button class="btn green" onclick="review('${x.id}','approve')">อนุมัติ / Approve</button><button class="btn red" onclick="review('${x.id}','reject')">ปฏิเสธ / Request New Slip</button></div>`:""}</article>`}).join(""):`<article class="item">ไม่มีรายการ / No payments found.</article>`}
async function review(id,decision){if(!confirm(decision==="approve"?"Approve this payment?":"Request a new payment slip?"))return;try{const d=await api("admin_review",{payment_id:id,decision,note:document.getElementById("n-"+id)?.value||""});alert(d.status==="paid"?"Payment approved and confirmation email sent.":"Payment rejected and correction email sent.");load()}catch(e){alert(e.message)}} 
</script></body></html>
