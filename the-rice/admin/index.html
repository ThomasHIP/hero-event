<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HERO Event Organizer Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17233b;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}.top{background:linear-gradient(135deg,#102a56,#146e72);color:#fff;padding:20px}.topin,.wrap{max-width:1000px;margin:auto}.topin{display:flex;align-items:center;justify-content:space-between;gap:14px}.top img{width:170px;background:#fff;border-radius:10px}.top h1{font-size:24px}.wrap{padding:20px 14px 50px}.login,.item,.control{background:#fff;border:1px solid #dce4ef;border-radius:20px;padding:20px;margin-bottom:14px}.login input,.note,.search,select{width:100%;padding:14px;border:1px solid #bdc8d8;border-radius:12px;font-size:16px}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:850;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}.blue{background:#2f69e8;color:#fff}.green{background:#16844b;color:#fff}.red{background:#c7364f;color:#fff}.ghost{background:#eaf1fb;color:#244d8c}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#69768b}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff1c6;color:#725400;font-weight:800}.badge.approved{background:#e1f7e9;color:#137343}.badge.rejected{background:#ffe5e8;color:#a3263b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{background:#fff;border-radius:17px;padding:15px;border:1px solid #dce4ef}.stat b{font-size:27px;display:block}.stat small{color:#69768b}.control{display:grid;grid-template-columns:1fr 180px auto auto;gap:9px}.hidden{display:none!important}.result{font-weight:800;color:#176b43}.warning{color:#a3263b;font-weight:750}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.control{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.topin{align-items:flex-start;flex-direction:column}}
</style></head>
<body><header class="top"><div class="topin"><div><img src="/the-rice/hero-event-logo.jpg" alt="HERO Event"><h1>ผู้จัดงาน / Organizer Admin</h1></div><a class="btn ghost" href="/the-rice/" target="_blank">ดูแผนผัง / Floor Plan</a></div></header>
<main class="wrap"><section id="login" class="login"><h2>เข้าสู่ระบบผู้จัดงาน</h2><p class="muted">กรอกรหัสผู้จัดงาน / Enter the organizer passcode.</p><input id="pass" type="password" autocomplete="current-password" placeholder="Organizer passcode"><div class="row"><button class="btn blue" onclick="load()">เปิดแดชบอร์ด / Open Dashboard</button></div><p id="msg" class="warning"></p></section>
<section id="dashboard" class="hidden"><div id="stats" class="stats"></div><div class="control"><input id="search" class="search" placeholder="ค้นหา B30, ชื่อร้าน, Reference…" oninput="applyFilters()"><select id="filter" onchange="applyFilters()"><option value="all">ทุกสถานะ / All</option><option value="submitted">รอตรวจ / Pending</option><option value="approved">อนุมัติแล้ว / Approved</option><option value="rejected">ส่งใหม่ / Rejected</option></select><button class="btn blue" onclick="refresh()">รีเฟรช / Refresh</button><button class="btn ghost" onclick="logout()">ออก / Logout</button></div><p id="result" class="result"></p><section id="list"></section></section></main>
<script>
const API="https://ajbuenoxbsfmwhydvlxd.supabase.co/functions/v1/hero-event-api",KEY="sb_publishable_oron-nE6v6FSF_YPckMCGA_4QHstvwm";let code="",allRows=[];
const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
async function api(action,data={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({action,passcode:code,...data})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
function drawStats(s={}){stats.innerHTML=[["พื้นที่ทั้งหมด / Total",s.total||0],["ว่าง / Available",s.available||0],["รอชำระ / Awaiting",s.awaiting_payment||0],["ชำระแล้ว / Paid",s.paid||0],["สลิปรอตรวจ / Pending Slips",s.pending_slips||0],["ผู้แสดงสินค้า / Exhibitors",s.exhibitors||0],["ผู้เข้าชม / Visitors",s.visitors||0]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join("")}
async function load(){code=pass.value.trim();if(!code)return;msg.textContent="กำลังโหลด… / Loading…";try{sessionStorage.setItem("heroEventAdmin",code);login.classList.add("hidden");dashboard.classList.remove("hidden");await refresh()}catch(e){login.classList.remove("hidden");dashboard.classList.add("hidden");msg.textContent=e.message}}
async function refresh(){result.textContent="กำลังโหลด… / Loading…";try{const d=await api("admin_list");allRows=d.payments||[];drawStats(d.stats);applyFilters();result.textContent=`แสดง ${allRows.length} รายการ / ${allRows.length} payment records`}catch(e){result.textContent=e.message}}
function applyFilters(){const q=search.value.trim().toLowerCase(),f=filter.value;render(allRows.filter(x=>{const r=Array.isArray(x.reservations)?x.reservations[0]:x.reservations,g=Array.isArray(r.registrations)?r.registrations[0]:r.registrations,b=Array.isArray(r.booths)?r.booths[0]:r.booths;return(f==="all"||x.status===f)&&(!q||[b.code,g.business_name,g.full_name,g.email,r.booking_reference].join(" ").toLowerCase().includes(q))}))}
function render(rows){list.innerHTML=rows.length?rows.map(x=>{const r=Array.isArray(x.reservations)?x.reservations[0]:x.reservations,g=Array.isArray(r.registrations)?r.registrations[0]:r.registrations,b=Array.isArray(r.booths)?r.booths[0]:r.booths;return `<article class="item"><span class="badge ${esc(x.status)}">${esc(x.status)}</span><h2>${esc(b.code)} — ${esc(g.business_name)}</h2><div class="meta"><div><b>Booking Reference</b><br>${esc(r.booking_reference)}<br><span class="muted">Method: ${esc(x.method)}</span></div><div><b>Contact</b><br>${esc(g.full_name)}<br>${esc(g.email)}<br>${esc(g.mobile)}</div></div><div class="row">${x.slip_url?`<a class="btn ghost" href="${esc(x.slip_url)}" target="_blank">ดูสลิป / View Slip</a>`:""}<a class="btn ghost" href="/the-rice/shop/?booth=${encodeURIComponent(b.code)}" target="_blank">ดูหน้าร้าน / Shop Page</a></div>${x.review_note?`<p><b>Note:</b> ${esc(x.review_note)}</p>`:""}${x.status==="submitted"?`<textarea class="note" id="n-${x.id}" placeholder="หมายเหตุ / Review note"></textarea><div class="row"><button class="btn green" onclick="review('${x.id}','approve')">อนุมัติการชำระ / Approve Payment</button><button class="btn red" onclick="review('${x.id}','reject')">ปฏิเสธ / Request New Slip</button></div>`:""}</article>`}).join(""):`<article class="item">ไม่พบรายการ / No matching payments.</article>`}
async function review(id,decision){if(!confirm(decision==="approve"?"ยืนยันอนุมัติการชำระเงิน? / Approve this payment?":"ให้ผู้แสดงสินค้าส่งสลิปใหม่? / Request a new slip?"))return;try{const d=await api("admin_review",{payment_id:id,decision,note:document.getElementById("n-"+id)?.value||""});alert(d.status==="paid"?`อนุมัติแล้ว อีเมลยืนยันถูกส่งแล้ว และ HERO Credits: ${d.credits_awarded?"+200":"เคยได้รับแล้ว"} / Approved and confirmation sent.`:"แจ้งให้ส่งสลิปใหม่แล้ว / New slip requested.");await refresh()}catch(e){alert(e.message)}}
function logout(){sessionStorage.removeItem("heroEventAdmin");location.reload()}const saved=sessionStorage.getItem("heroEventAdmin");if(saved){pass.value=saved;load()}
</script></body></html>
