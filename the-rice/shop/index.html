<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HERO Event Shop</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17233b;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}.top{background:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dfe6f0}.brand{font-size:20px;font-weight:900}.brand b{color:#ed3e9d}.brand span{color:#2874e8}.pill{background:#e8f1ff;color:#195ac5;padding:8px 13px;border-radius:999px;font-weight:800}.wrap{max-width:760px;margin:auto;padding:20px 16px 50px}.hero{background:linear-gradient(145deg,#102a56,#126b71);border-radius:28px;padding:26px;color:#fff}.logo{width:100%;max-height:260px;object-fit:contain;background:#fff;border-radius:20px;padding:12px}.eyebrow{color:#8be3df;font-weight:800;margin-top:20px}.hero h1{font-size:38px;margin:3px 0}.status,.card{border-radius:22px;padding:20px;margin-top:15px}.status{background:#fff3c8;color:#735500;font-weight:800}.status.paid{background:#e3f8ea;color:#167243}.card{background:#fff;border:1px solid #dfe6f0}.card h2{margin:0 0 12px}.value{font-size:18px;line-height:1.55;white-space:pre-line}.label{font-size:14px;color:#68758b;font-weight:750;margin-top:18px}.actions{display:grid;gap:10px;margin-top:20px}.btn{padding:15px;text-align:center;text-decoration:none;border-radius:15px;font-weight:850}.primary{background:#2f69e8;color:#fff}.secondary{border:2px solid #2f69e8;color:#2058c5}.upgrade{background:linear-gradient(135deg,#ffeaf6,#eaf2ff)}.powered{text-align:center;color:#748095;margin-top:28px}.powered img{width:160px;vertical-align:middle;margin-left:10px}.loading{text-align:center;padding:80px 20px;color:#68758b}@media(min-width:620px){.actions{grid-template-columns:1fr 1fr}}</style></head>
<body><header class="top"><div class="brand"><b>TheRice-</b><span>Event</span></div><div id="boothPill" class="pill">Shop</div></header><main id="app" class="wrap"><div class="loading">กำลังโหลดหน้าร้าน…<br>Loading shop page…</div></main>
<script>
const API="https://ajbuenoxbsfmwhydvlxd.supabase.co/functions/v1/hero-event-api",KEY="sb_publishable_oron-nE6v6FSF_YPckMCGA_4QHstvwm";
const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const booth=(new URLSearchParams(location.search).get("booth")||"").toUpperCase();
async function load(){try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({action:"shop",booth_code:booth})});const d=await r.json();if(!r.ok)throw Error(d.error||"Unavailable");const s=d.shop;document.title=`${s.exhibitor_name} — ${s.code} | The Rice Event`;boothPill.textContent=`พื้นที่ ${s.code} / Booth ${s.code}`;const paid=s.status==="paid";app.innerHTML=`<section class="hero">${s.logo_url?`<img class="logo" src="${esc(s.logo_url)}" alt="${esc(s.exhibitor_name)}">`:""}<div class="eyebrow">ผู้แสดงสินค้า / Exhibitor</div><h1>${esc(s.exhibitor_name)}</h1></section><div class="status ${paid?"paid":""}">${paid?"✓ ชำระเงินและยืนยันพื้นที่แล้ว / Paid and confirmed":"● รอตรวจสอบการชำระเงิน / Awaiting payment verification"}</div><section class="card"><h2>สินค้าและบริการ<br><span style="color:#68758b;font-weight:500">Products & Services</span></h2><div class="value">${esc(s.products)}</div><div class="label">เกี่ยวกับร้าน / About</div><div class="value">${esc(s.business_description)}</div><div class="label">ตำแหน่ง / Location</div><div class="value">${esc(s.sector_name)} — ${esc(s.code)}</div><div class="actions"><a class="btn primary" href="/the-rice/">ดูแผนผังงาน / View Floor Plan</a>${s.business_link?`<a class="btn secondary" href="${esc(s.business_link)}" target="_blank" rel="noopener">เว็บไซต์ร้าน / Shop Website</a>`:""}</div></section><section class="card upgrade"><h2>อัปเกรดเป็น HERO FastPage</h2><div class="value">เพิ่มสินค้า รูปภาพ โปรโมชั่น LINE และ QR Code</div><div style="color:#68758b;margin-top:7px">More products, images, promotions, LINE contact and a shareable QR code.</div></section><div class="powered">ระบบโดย / Platform by <img src="/the-rice/hero-event-logo.jpg" alt="HERO Event"></div>`;}catch(e){app.innerHTML=`<section class="card"><h2>ไม่พบหน้าร้าน / Shop unavailable</h2><p>${esc(e.message)}</p><a class="btn primary" href="/the-rice/">กลับไปแผนผัง / Return to floor plan</a></section>`;}}load();
</script></body></html>
